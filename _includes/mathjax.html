<!-- MathJax 3: comprehensive LaTeX for a research blog.
     Kramdown converts Markdown $$...$$ to the appropriate delimiter. Inside
     raw HTML, use \(...\) inline and $$...$$ on separate lines for displays. -->
<script>
  window.MathJax = {
    loader: {
      load: ['[tex]/physics', '[tex]/mathtools', '[tex]/amscd',
             '[tex]/textmacros', '[tex]/color', '[tex]/cancel',
             '[tex]/boldsymbol', '[tex]/noerrors']
    },
    tex: {
      // Match kramdown's inline/display output and explicit raw-HTML delimiters.
      // Keep $$...$$ for display as a fallback. Single $ remains ordinary prose.
      inlineMath: [['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      processRefs: true,
      tags: 'ams',
      maxBuffer: 10 * 1024,
      packages: {
        '[+]': ['physics', 'mathtools', 'amscd', 'textmacros', 'color',
                'cancel', 'boldsymbol', 'ams', 'noerrors', 'noundefined']
      },
      ams: { multlineWidth: '95%' },
      macros: {
        // Number sets
        RR: '\\mathbb{R}', NN: '\\mathbb{N}', ZZ: '\\mathbb{Z}',
        QQ: '\\mathbb{Q}', CC: '\\mathbb{C}',
        // Probability / stats
        EE: '\\mathbb{E}', PP: '\\mathbb{P}',
        Var: '\\operatorname{Var}', Cov: '\\operatorname{Cov}',
        Corr: '\\operatorname{Corr}',
        Normal: '\\mathcal{N}', Bern: '\\mathrm{Bernoulli}',
        KL: ['\\mathrm{KL}\\!\\left(#1 \\,\\|\\, #2\\right)', 2],
        // Linear algebra
        T: '^{\\mathsf{T}}',
        tr: '\\operatorname{tr}', rank: '\\operatorname{rank}',
        diag: '\\operatorname{diag}', sign: '\\operatorname{sign}',
        vct: ['\\boldsymbol{#1}', 1], mat: ['\\mathbf{#1}', 1],
        inner: ['\\left\\langle #1,\\, #2 \\right\\rangle', 2],
        // Optimization / ML
        argmin: '\\operatorname*{arg\\,min}',
        argmax: '\\operatorname*{arg\\,max}',
        softmax: '\\operatorname{softmax}',
        relu: '\\operatorname{ReLU}',
        Loss: '\\mathcal{L}', Data: '\\mathcal{D}', Hyp: '\\mathcal{H}',
        // Shorthands
        given: '\\mathbin{\\vert}',
        defeq: '\\mathrel{\\vcenter{:}}=',
        indep: '\\perp\\!\\!\\!\\perp',
        ind: '\\mathbb{1}',
        eps: '\\varepsilon', half: '\\tfrac{1}{2}'
      }
    },
    chtml: { scale: 1.0, displayAlign: 'center', displayIndent: '0' },
    options: {
      // Typeset the whole page (code/pre/script tags are skipped by default).
      // Add class="tex2jax_ignore" to any element you want MathJax to skip.
      ignoreHtmlClass: 'tex2jax_ignore',
      renderActions: {
        // Reveal math only once typeset, to avoid a raw-source flash.
        addReady: [10, function () {
          document.body.classList.add('math-ready');
        }]
      }
    }
  };
</script>
<script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
