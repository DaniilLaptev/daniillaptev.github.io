# ─── Site ───────────────────────────────────────────────────────────────
title: "molchat neironki"
tagline: "Technical notes and visual explanations"
lang: en
description: >-
  A minimal notebook for mathematical explanations, technical notes, and
  interactive figures.
author: "molchat neironki"

# Set these to the public origin and repository path before a permanent release.
baseurl: ""
url: ""

# ─── Build ──────────────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /posts/:title/

# Show posts whose date is in the future (Jekyll hides them otherwise).
# Lets you write ahead and keeps posts visible regardless of the build clock.
future: true

kramdown:
  input: GFM
  hard_wrap: false
  # kramdown converts $$...$$ in Markdown into bare \( \) (inline) and \[ \]
  # (display) delimiters, which MathJax 3 picks up directly (see
  # _includes/mathjax.html). It still PROTECTS math content from Markdown, so
  # underscores and asterisks inside $$...$$ never get mangled.
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Reading-time helper reads this words-per-minute figure.
reading_speed: 220

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/paper-vortex.jpg
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      toc: true
# ─── Plugins (all GitHub Pages safe) ────────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .sass-cache
  - node_modules
